name: Build & Push Worker Image

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/docker.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: workers/nano
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/video-studio-worker:latest
