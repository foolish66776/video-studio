[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "gradio>=4.40",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "boto3>=1.34",
    "fal-client>=0.5",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
